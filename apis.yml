aid: zally
name: Zally
description: >-
  Zally is an open source API linter from Zalando that validates OpenAPI 2 and 3 specifications against configurable
  rule sets for API design consistency. It exposes a REST API, command-line interface, and web UI for checking API
  designs against Zalando's RESTful API Guidelines or custom rule sets.
