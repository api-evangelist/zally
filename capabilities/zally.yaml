naftiko: 1.0.0-alpha2
info:
  label: Zally - Zalando's API Linter
  description: 'Zally - Zalando''s API Linter. 4 operations. Lead operation: Zally API Violations. Self-contained Naftiko
    capability covering one Zally business surface.'
  tags:
  - Zally
  - Zally - Zalando's API Linter
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ZALLY_API_KEY: ZALLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: zally
    baseUri: https://zally.on.inter.net
    description: Zally - Zalando's API Linter business capability. Self-contained, no shared references.
    resources:
    - name: api-violations
      path: /api-violations
      operations:
      - name: post
        method: POST
        description: Zally API Violations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-violations-externalId
      path: /api-violations/{externalId}
      operations:
      - name: get
        method: GET
        description: Zally Get Previous Generated Validation Result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: review-statistics
      path: /review-statistics
      operations:
      - name: get
        method: GET
        description: Zally Provides Query Capabilites for Linting Summaries and Automatically Computed Review Statistics.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: supported-rules
      path: /supported-rules
      operations:
      - name: get
        method: GET
        description: Zally Suported Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ZALLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: zally-rest
    port: 8080
    description: REST adapter for Zally - Zalando's API Linter. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api-violations
      name: api-violations
      description: REST surface for api-violations.
      operations:
      - method: POST
        name: post
        description: Zally API Violations
        call: zally.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-violations/{externalid}
      name: api-violations-externalid
      description: REST surface for api-violations-externalId.
      operations:
      - method: GET
        name: get
        description: Zally Get Previous Generated Validation Result
        call: zally.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/review-statistics
      name: review-statistics
      description: REST surface for review-statistics.
      operations:
      - method: GET
        name: get
        description: Zally Provides Query Capabilites for Linting Summaries and Automatically Computed Review Statistics.
        call: zally.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/supported-rules
      name: supported-rules
      description: REST surface for supported-rules.
      operations:
      - method: GET
        name: get
        description: Zally Suported Rules
        call: zally.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: zally-mcp
    port: 9090
    transport: http
    description: MCP adapter for Zally - Zalando's API Linter. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: zally-api-violations
      description: Zally API Violations
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: zally.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: zally-get-previous-generated-validation
      description: Zally Get Previous Generated Validation Result
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zally.get
      outputParameters:
      - type: object
        mapping: $.
    - name: zally-provides-query-capabilites-linting
      description: Zally Provides Query Capabilites for Linting Summaries and Automatically Computed Review Statistics.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zally.get
      outputParameters:
      - type: object
        mapping: $.
    - name: zally-suported-rules
      description: Zally Suported Rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zally.get
      outputParameters:
      - type: object
        mapping: $.
